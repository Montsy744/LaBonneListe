services:

  postgres:
    image: postgres:16
    container_name: labonneliste-db
    environment:
      POSTGRES_DB: labonneliste
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: labonneliste-back
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/labonneliste
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password

  frontend:
    build: ./frontend
    container_name: labonneliste-front
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: